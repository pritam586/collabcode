# Included by every location that returns content, because nginx drops server-level
# add_header directives in any location that sets its own.
#
# Content-Security-Policy:
# - script-src: the app's own files plus inline scripts carrying this request's nonce
#   (index.html's theme script and the JavaScript runner's sandboxed frame). 'unsafe-eval'
#   is required only because the runner evaluates the user's code inside a sandboxed
#   iframe's web worker, and both inherit this policy.
# - worker-src: Monaco's language workers ('self') and the runner's worker (blob:).
# - style-src 'unsafe-inline': Monaco positions its UI with inline styles.
# - connect-src 'self': the API and WebSocket are proxied on this origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
