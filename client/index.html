<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: the on-screen keyboard shrinks the layout instead of covering the editor. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0d1018" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="CollabCode is a real-time collaborative code editor with live cursors, chat, shared tasks and a sandboxed code runner. No sign-up needed." />
    <title>CollabCode: code together in real time</title>
    <script>
      // Apply the saved or system theme before the first paint, so the page never flashes the wrong colors.
      (function () {
        var preference = 'system';
        try { preference = JSON.parse(localStorage.getItem('collabcode-theme')) || 'system'; } catch (error) {}
        var dark = preference === 'dark' || (preference === 'system' && !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches));
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <noscript>CollabCode needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
